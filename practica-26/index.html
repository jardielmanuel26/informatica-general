<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link href="./css/estilos.css" rel="stylesheet">
        <title>Práctica 26</title>
    </head>
    <body>
        <header>
            <h1>Presupuesto para el montaje de una obra de arte multimedia</h1>
        </header>
        <main>
               <form id="formPresupuesto">
                <label for="proyectores">Cantidad de proyectores a alquilar ($45.000/dia):</label>
                <input type="number" name="proyectores" id="proyectores" placeholder="ingresar cantidad">

                <label for="computadoras">Cantidad de computadoras a alquilar ($50.000/dia):</label>
                <input type="number" name="computadoras" id="computadoras" placeholder="ingresar cantidad">

                <label for="pantallas">Cantidad de pantallas a alquilar ($35.000/dia):</label>
                <input type="number" name="pantallas" id="pantallas" placeholder="ingresar cantidad">

                <label for="dias">Cantidad de dias alquilando el equipo:</label>
                <input type="number" name="dias" id="dias" placeholder="ingresar cantidad">

                <button type="submit">Calcular presupuesto</button>
               </form> 

            <div id="resultado"></div>
        </main>
        <footer><p>Hecho por Manuel Yujra</p></footer>
        <script src="./js/script.js"></script>
    </body>
</html>
