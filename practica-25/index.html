<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link href="./css/estilos.css" rel="stylesheet">
        <title>Práctica 25</title>
    </head>
    <body>
        <header>
            <h1>Recomendación de series</h1>
        </header>
        <main>
               <form id="formSeries">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingresar nombre">
                <label for="edad">Edad</label>
                <input type="number" name="edad" id="edad" placeholder="Ingresar edad">
                <label for="generoSerie">Género favorito:</label>
                <select name="genero serie" id="generoSerie">
                    <option value="comedia">Comedia</option>
                    <option value="accion">Accion</option>
                    <option value="romance">Romance</option>
                    <option value="terror">Terror</option>
                    <option value="documental">Documental</option>
                </select>

                <button type="submit">Obtener recomendación de serie</button>
               </form> 

            <div id="resultado"></div>
        </main>
        <footer><p>Hecho por Manuel Yujra</p></footer>
        <script src="./js/script.js"></script>
    </body>
</html>
